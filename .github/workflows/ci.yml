name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m compileall terminal_monitor/ terminal_monitor.py supervisor.py

      - name: Run ruff lint (pinned)
        run: |
          pip install "ruff==0.16.*"
          ruff check .

      - name: Run unit tests with coverage
        run: |
          pip install "coverage>=7.0"
          coverage run --source=terminal_monitor -m unittest discover -s tests -v
          coverage report --fail-under=75

      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.python-version }}
          path: htmlcov
          if-no-files-found: ignore

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run mypy
        run: |
          pip install "mypy>=1.8"
          mypy terminal_monitor/
