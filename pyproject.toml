[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["terminal_monitor"]

[tool.setuptools.dynamic]
version = { attr = "terminal_monitor.__version__" }

[tool.mypy]
python_version = "3.10"
files = ["terminal_monitor"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Blind excepts and try-except-pass are intentional in a long-running
    # monitor: it must never crash because of a transient subprocess error.
    "BLE001",
    "S110",
    # Embedded AppleScript templates and TUI bullet characters (●○◉❯) are
    # intentionally long/unicode; they must not be rewritten.
    "E501",
    "RUF001",
]

[tool.ruff.lint.isort]
known-first-party = ["terminal_monitor"]

[project]
name = "ai-agent-terminal-monitor"
dynamic = ["version"]
description = "Universal, autonomous watcher and safe continuation driver for any AI coding agent CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cassio Marques Campos" }
]
keywords = [
    "ai-agent",
    "terminal",
    "claude-code",
    "opencode",
    "aider",
    "goose",
    "tmux",
    "iterm2",
    "automation",
    "llm",
    "cli-monitor"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
terminal-monitor = "terminal_monitor:main"
terminal-monitor-supervise = "terminal_monitor.supervise:main"

[project.urls]
Homepage = "https://github.com/cassiomc1/ai-agent-terminal-monitor"
Repository = "https://github.com/cassiomc1/ai-agent-terminal-monitor"
Issues = "https://github.com/cassiomc1/ai-agent-terminal-monitor/issues"
