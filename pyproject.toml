[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-terminal-monitor"
version = "1.0.0"
description = "Universal, autonomous watcher and safe continuation driver for any AI coding agent CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cassio Marques Campos" }
]
keywords = [
    "ai-agent",
    "terminal",
    "claude-code",
    "opencode",
    "aider",
    "goose",
    "tmux",
    "iterm2",
    "automation",
    "llm",
    "cli-monitor"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
terminal-monitor = "terminal_monitor:main"

[project.urls]
Homepage = "https://github.com/cassiomc1/ai-agent-terminal-monitor"
Repository = "https://github.com/cassiomc1/ai-agent-terminal-monitor"
Issues = "https://github.com/cassiomc1/ai-agent-terminal-monitor/issues"
