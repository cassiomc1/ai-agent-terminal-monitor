# Terminal Monitor Project Configuration
# Place this in your project root as .terminal-monitor.toml

profile = "claude"
process = "claude"
title = "my-project"
backend = "auto"
continue_text = "Proceed from the next incomplete step. Stop if you need human guidance."
poll_seconds = 3.0
idle_seconds = 15.0
cooldown_seconds = 20.0
gone_seconds = 25.0
max_sends = 100
auto_allow_permissions = false
state_dir = "/tmp/terminal-monitor"
objective = "Finish every assigned task, create the Pull Request, wait for green checks, merge it, and verify main."
prohibitions = ["Do not publish to npm."]
task_id = "example-task"
required_outcome = "merged"
npm_publish_allowed = false
session_id = ""

unsafe_phrases = [
  "bypass",
  "delete",
  "discard",
  "drop database",
  "force",
  "hard reset",
  "overwrite",
  "purge",
  "remove protection",
  "reset --hard",
  "rm -rf",
  "skip validation"
]

[custom_profiles.my-custom-agent]
process = "myagent"
description = "Custom profile for an in-house AI CLI agent"
thinking_patterns = ["thinking...", "processing task", "running tool"]
permission_patterns = ["authorize this action?", "do you want to continue? [y/n]"]
question_indicators = ["(recommended)", "choose an option"]
option_patterns = ["^\\s*[●○◉]\\s+\\S", "^\\s*\\d+[.)\\]]\\s+\\S"]
auto_permission_payload = "y"
